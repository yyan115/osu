name: Isolate socket shutdown regression
on:
  push:
    branches: [ci/socket-shutdown-repro]
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Prepare isolated probe from verified production blobs
        run: |
          $ErrorActionPreference = 'Stop'
          $blob = git hash-object osu.Game/IPC/WebSocketServer.cs
          if ($blob -ne '2d3193563031322f53a5a2a734025ff4896484c2') { throw 'Unexpected server source' }
          New-Item -ItemType Directory -Force probe | Out-Null
          Copy-Item scripts/socket-probe/Program.cs probe/
          $program = (Get-Content probe/Program.cs -Raw).Replace('i < 25', 'i < 250')
          Set-Content probe/Program.cs $program
          Copy-Item osu.Game/IPC/WebSocketServer.cs,osu.Game/IPC/WebSocketChannel.cs,osu.Game.Tests/IPC/WebSocketClient.cs probe/
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><Nullable>enable</Nullable></PropertyGroup>
          </Project>
          '@ | Set-Content probe/probe.csproj
          '<Project />' | Set-Content probe/Directory.Build.props
          '<Project />' | Set-Content probe/Directory.Build.targets
          $blob | Set-Content server-blob.txt
      - name: Test all four shutdown scenarios across 1000 cycles
        run: |
          dotnet run --project probe/probe.csproj -c Release *> socket-fixed.log
          $code = $LASTEXITCODE
          Get-Content socket-fixed.log
          if ($code -ne 0) { exit $code }
          if (-not (Select-String -Path socket-fixed.log -SimpleMatch 'TOTAL direct=0 unobserved=0')) { throw 'Missing successful stress summary' }
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: socket-shutdown-proof-${{ matrix.os }}
          path: |
            socket-fixed.log
            server-blob.txt
          if-no-files-found: error
