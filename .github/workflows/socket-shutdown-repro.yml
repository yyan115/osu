name: Isolate socket shutdown regression
on:
  push:
    branches: [ci/socket-shutdown-repro]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Prepare isolated probe
        shell: bash
        run: |
          mkdir -p /tmp/socket-probe
          cp scripts/socket-probe/Program.cs /tmp/socket-probe/
          sed -i 's/i < 25/i < 250/' /tmp/socket-probe/Program.cs
          cp osu.Game/IPC/WebSocketServer.cs osu.Game/IPC/WebSocketChannel.cs osu.Game.Tests/IPC/WebSocketClient.cs /tmp/socket-probe/
          cat > /tmp/socket-probe/probe.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><Nullable>enable</Nullable></PropertyGroup>
          </Project>
          EOF
      - name: Record baseline with first-chance diagnostics
        shell: bash
        run: |
          set +e
          dotnet run --project /tmp/socket-probe/probe.csproj -c Release > socket-original.log 2>&1
          result=$?
          cat socket-original.log
          echo "Baseline exit: $result"
          test "$result" -eq 1
      - name: Test channel shutdown before listener shutdown
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/socket-probe/WebSocketServer.cs')
          s = p.read_text()
          start = s.index('            try\n            {\n                listener?.Stop();')
          end = s.index('            try\n            {\n                await Task.WhenAll(channels.Values', start)
          block = s[start:end]
          s = s[:start] + s[end:]
          marker = '            logger.Add(@"Websocket server stopped.");'
          assert s.count(marker) == 1
          p.write_text(s.replace(marker, block + marker))
          PY
          set +e
          dotnet run --project /tmp/socket-probe/probe.csproj -c Release > socket-reordered.log 2>&1
          result=$?
          cat socket-reordered.log
          echo "Reordered exit: $result"
          exit "$result"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: socket-shutdown-probe
          path: socket-*.log
          if-no-files-found: error
