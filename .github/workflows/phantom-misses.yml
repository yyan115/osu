name: Phantom Misses Desktop

on:
  push:
    branches: [master, phantom-misses, fix/phantom-miss-fidelity]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phantom-misses-desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build-test-package:
    name: Build and test (${{ matrix.rid }})
    if: github.repository == 'yyan115/osu'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v6

      - name: Archive exact source for fidelity review
        if: matrix.rid == 'linux-x64' && github.ref == 'refs/heads/fix/phantom-miss-fidelity'
        run: git archive --format=tar --output=fidelity-source.tar HEAD

      - name: Upload fidelity review source
        if: matrix.rid == 'linux-x64' && github.ref == 'refs/heads/fix/phantom-miss-fidelity'
        uses: actions/upload-artifact@v7
        with:
          name: phantom-fidelity-source
          path: fidelity-source.tar
          retention-days: 7
          if-no-files-found: error

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build desktop and tests
        run: dotnet build osu.Desktop.slnf -c Debug -warnaserror -p:EnforceCodeStyleInBuild=true

      - name: Run Phantom Misses regression tests
        run: >-
          dotnet test osu.Game.Rulesets.Osu.Tests/osu.Game.Rulesets.Osu.Tests.csproj
          -c Debug --no-build
          --filter FullyQualifiedName~TestSceneOsuModPhantomMisses
          --logger 'trx;LogFileName=phantom-misses.trx'
          --results-directory TestResults
          -- NUnit.ConsoleOut=0

      - name: Validate osu mod registration and incompatibilities
        run: >-
          dotnet test osu.Game.Tests/osu.Game.Tests.csproj
          -c Debug --no-build
          --filter FullyQualifiedName~TestSceneModValidity.TestOsu
          --logger 'trx;LogFileName=mod-validity.trx'
          --results-directory TestResults
          -- NUnit.ConsoleOut=0

      - name: Recheck broader CI regressions in both threading modes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $filters = 'FullyQualifiedName~TestScenePlayerSkinDependencies|FullyQualifiedName~osu.Game.Tests.NonVisual.CustomDataDirectoryTest|FullyQualifiedName~osu.Game.Tests.IPC.WebSocketTest|FullyQualifiedName~osu.Game.Tests.Database.BackgroundDataStoreProcessorTests|FullyQualifiedName~osu.Game.Rulesets.Taiko.Tests.Judgements.TestSceneHitJudgements|FullyQualifiedName~TestSceneSoloResultsScreenLeaderboard|FullyQualifiedName~osu.Game.Tests.Scores.|FullyQualifiedName~osu.Game.Tests.Skins.|FullyQualifiedName~TestScenePlayerScoreSubmission|FullyQualifiedName~TestSceneSpectator|FullyQualifiedName~TestSceneHitErrorMeter|FullyQualifiedName~TestSceneColourHitErrorMeter|FullyQualifiedName~TestSceneBeatmapCarouselSetsSplitApart|FullyQualifiedName~TestSceneLoginOverlay|FullyQualifiedName~osu.Game.Rulesets.Taiko.Tests.TestSceneSampleOutput|FullyQualifiedName~osu.Game.Rulesets.Taiko.Tests.TestSceneLegacyReplayPlayback'
          foreach ($mode in @('SingleThread', 'MultiThreaded')) {
            $env:OSU_EXECUTION_MODE = $mode
            dotnet test osu.Game.Tests/bin/Debug/net10.0/osu.Game.Tests.dll osu.Game.Rulesets.Taiko.Tests/bin/Debug/net10.0/osu.Game.Rulesets.Taiko.Tests.dll --filter $filters --logger "trx;LogFileName=ci-regressions-$mode.trx" --results-directory TestResults -- NUnit.ConsoleOut=0
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            [xml] $report = Get-Content "TestResults/ci-regressions-$mode.trx" -Raw
            if ([int] $report.TestRun.ResultSummary.Counters.executed -eq 0) { throw "No regression tests executed for $mode" }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phantom-tests-${{ matrix.rid }}
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Publish self-contained desktop client
        run: >-
          dotnet publish osu.Desktop/osu.Desktop.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=false -p:PublishTrimmed=false
          -o artifacts/phantom-misses-${{ matrix.rid }}

      - name: Verify reports and package portable client
        shell: pwsh
        run: ./scripts/package-phantom-misses.ps1 -RuntimeIdentifier '${{ matrix.rid }}'

      - name: Upload client
        uses: actions/upload-artifact@v7
        with:
          name: phantom-package-${{ matrix.rid }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  release:
    name: Publish Windows and Linux release
    needs: build-test-package
    if: github.repository == 'yyan115/osu' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: phantom-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: phantom-package-*
          path: dist
          merge-multiple: true

      - name: Publish versioned release after both platforms pass
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-phantom-release.sh
